<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 助手</title>
    <style>
      :root {
        --bg: #f3f4f7;
        --card: #ffffff;
        --text: #1f2329;
        --muted: #6b7280;
        --primary: #3b82f6;
        --primary-soft: #e8f1ff;
        --assistant: #f8fafc;
        --border: #e5e7eb;
        --shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 45%);
      }

      .page {
        max-width: 920px;
        margin: 28px auto;
        padding: 0 14px;
      }

      .chat-shell {
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--card);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .header {
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, #ffffff 0%, #fafbfd 100%);
      }

      .title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }

      .subtitle {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .status-pill {
        display: inline-flex;
        margin-top: 10px;
        padding: 5px 10px;
        border-radius: 999px;
        background: #f5f7fb;
        color: #4b5563;
        font-size: 12px;
      }

      .messages {
        padding: 22px 16px;
        min-height: 430px;
        max-height: 62vh;
        overflow-y: auto;
        background:
          linear-gradient(transparent 95%, rgba(0, 0, 0, 0.02) 100%),
          #fcfdff;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        margin-top: 38px;
        font-size: 14px;
      }

      .msg-row {
        display: flex;
        margin-bottom: 14px;
      }

      .msg-row.user {
        justify-content: flex-end;
      }

      .msg-row.assistant {
        justify-content: flex-start;
      }

      .bubble {
        max-width: min(680px, 84%);
        border-radius: 16px;
        padding: 12px 14px;
        white-space: pre-wrap;
        line-height: 1.55;
        font-size: 14px;
        border: 1px solid var(--border);
      }

      .msg-row.user .bubble {
        background: var(--primary-soft);
        border-color: #cfe2ff;
      }

      .msg-row.assistant .bubble {
        background: var(--assistant);
      }

      .meta {
        margin-top: 5px;
        font-size: 12px;
        color: #8a93a1;
      }

      .composer {
        border-top: 1px solid var(--border);
        padding: 14px;
        background: #ffffff;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .input-wrap {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px;
        background: #fff;
      }

      .prompt-input {
        width: 100%;
        border: none;
        outline: none;
        resize: none;
        min-height: 44px;
        max-height: 130px;
        font-size: 14px;
        line-height: 1.55;
        font-family: inherit;
      }

      .btn {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        padding: 10px 14px;
        border-radius: 11px;
        font-size: 14px;
        cursor: pointer;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .btn-voice {
        min-width: 96px;
      }

      .hint {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .audio-bar {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .audio-bar audio {
        flex: 1;
      }

      .typing::after {
        content: "● ● ●";
        margin-left: 8px;
        letter-spacing: 2px;
        font-size: 11px;
        color: #94a3b8;
        animation: pulse 1s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="chat-shell">
        <header class="header">
          <h1 class="title">AI 助手</h1>
          <div class="subtitle">录音后自动识别，再调用 AI 流式回复</div>
          <div class="status-pill" id="status">状态：未开始</div>
        </header>

        <section class="messages" id="messages">
          <div class="empty" id="emptyTip">点击下方开始录音，体验语音问答。</div>
        </section>

        <footer class="composer">
          <div class="toolbar">
            <div class="input-wrap">
              <textarea
                class="prompt-input"
                id="promptInput"
                placeholder="输入问题，回车发送（Shift+Enter 换行）；也可以用语音按钮说话"
              ></textarea>
            </div>
            <button class="btn btn-voice" id="recordBtn">语音输入</button>
            <button class="btn btn-primary" id="sendBtn">发送</button>
          </div>
          <div class="hint">
            文字直问：/ai/chat/stream；语音链路：/speech/asr -> /ai/chat/stream；语音合成：/speech/tts/ws
          </div>
          <div class="audio-bar">
            <span>AI 语音播放</span>
            <audio id="ttsAudio" controls preload="none"></audio>
          </div>
        </footer>
      </section>
    </main>

    <script>
      const promptInput = document.getElementById("promptInput");
      const sendBtn = document.getElementById("sendBtn");
      const recordBtn = document.getElementById("recordBtn");
      const statusEl = document.getElementById("status");
      const messagesEl = document.getElementById("messages");
      const emptyTipEl = document.getElementById("emptyTip");
      const ttsAudioEl = document.getElementById("ttsAudio");

      let mediaRecorder = null;
      let chunks = [];
      let activeStream = null;
      let activeAssistantContentEl = null;
      let activeAssistantMetaEl = null;
      let activeRecordStream = null;
      let isRecording = false;
      let ttsWs = null;
      let ttsSessionId = null;
      let ttsMediaSource = null;
      let ttsSourceBuffer = null;
      let ttsPendingBuffers = [];
      let ttsStreamFinal = false;
      let ttsObjectUrl = null;

      function setStatus(text, isTyping = false) {
        statusEl.textContent = "状态：" + text;
        statusEl.classList.toggle("typing", isTyping);
      }

      function nowTime() {
        return new Date().toLocaleTimeString("zh-CN", { hour12: false });
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function hideEmptyTip() {
        if (emptyTipEl) {
          emptyTipEl.style.display = "none";
        }
      }

      // 【创建对话UI】在聊天界面添加一条消息，包含角色、文本内容和元信息（如时间戳），适用于在用户提问或 AI 回复时动态创建消息元素并显示在聊天界面上，同时确保界面滚动到最新消息的位置
      function appendMessage(role, text, metaText) {
        hideEmptyTip();
        const row = document.createElement("div");
        row.className = "msg-row " + role;

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        const content = document.createElement("div");
        content.textContent = text;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = metaText || nowTime();

        bubble.appendChild(content);
        bubble.appendChild(meta);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();

        return { row, bubble, content, meta };
      }

      // 关闭当前的 AI 流式连接（如果有），用于开始新的提问或清理资源
      function closeActiveStream() {

        if (activeStream) {
          activeStream.close();
          activeStream = null;
        }
      }

      // 关闭 TTS WebSocket 连接，并重置相关状态和播放器，适用于对话结束或发生错误时清理资源
      function closeTtsWs() {

        if (ttsWs) {
          ttsWs.close();
          ttsWs = null;
        }

        ttsSessionId = null;
        resetTtsPlayer();
      }

      /// 重置 TTS 播放器，清除所有待处理的音频缓冲区和相关状态，并释放对象 URL 资源，确保播放器处于初始状态准备接收新的 TTS 流
      function resetTtsPlayer() {

        ttsPendingBuffers = [];
        ttsStreamFinal = false;
        ttsSourceBuffer = null;
        ttsMediaSource = null;

        if (ttsObjectUrl) {
          URL.revokeObjectURL(ttsObjectUrl);
          ttsObjectUrl = null;
        }

        ttsAudioEl.pause();
        ttsAudioEl.removeAttribute("src");
        ttsAudioEl.load();
      }

      // 初始化 TTS 流式播放，创建 MediaSource 和 SourceBuffer，并设置播放器源为 MediaSource 对象 URL，准备接收和播放后续的 TTS 音频数据
      function prepareStreamingAudio() {
        // 每次新的 TTS 流开始前重置播放器状态，确保之前的播放资源被正确清理，避免不同 TTS 流之间的资源冲突和播放问题
        resetTtsPlayer();

        if (!window.MediaSource || !MediaSource.isTypeSupported("audio/mpeg")) {
          return;
        }

        ttsMediaSource = new MediaSource();
        ttsObjectUrl = URL.createObjectURL(ttsMediaSource);
        // 将 audio 元素的 src 设置为 MediaSource 对象的 URL，使其准备好接收通过 MediaSource 传入的音频数据进行播放
        ttsAudioEl.src = ttsObjectUrl;

        ttsMediaSource.addEventListener("sourceopen", () => {

          if (!ttsMediaSource) return;

          ttsSourceBuffer = ttsMediaSource.addSourceBuffer("audio/mpeg");
          ttsSourceBuffer.mode = "sequence";

          // 监听 SourceBuffer 的 updateend 事件，在每次缓冲区更新完成后调用 flushTtsBufferQueue 函数，确保新的音频数据能够及时添加到 SourceBuffer 中进行连续播放
          ttsSourceBuffer.addEventListener("updateend", flushTtsBufferQueue);
          flushTtsBufferQueue();
        });
      }

      // 处理 TTS 音频缓冲区队列，依次将接收到的音频数据添加到 SourceBuffer 中进行播放，并在流结束时正确关闭 MediaSource，确保 TTS 音频能够连续流式播放
      function flushTtsBufferQueue() {

        if (!ttsSourceBuffer || !ttsMediaSource) return;

        // 如果 SourceBuffer 正在更新，说明正在处理之前添加的缓冲区，此时需要等待更新完成后再继续添加新的缓冲区，避免同时修改 SourceBuffer 导致的错误
        if (ttsSourceBuffer.updating) return;

        if (ttsPendingBuffers.length > 0) {

          const next = ttsPendingBuffers.shift();

          // 将下一个待处理的音频缓冲区添加到 SourceBuffer 中，触发浏览器的音频播放机制，如果浏览器限制了自动播放则捕获异常并静默处理，确保用户体验不受影响
          if (next) {
            ttsSourceBuffer.appendBuffer(next);

            ttsAudioEl.play().catch(() => {
              // 静默处理自动播放限制
              console.warn("无法自动播放 TTS 音频，可能被浏览器限制了");
            });
          }
          return;
        }

        if (ttsStreamFinal && ttsMediaSource.readyState === "open") {
          try {
            ttsMediaSource.endOfStream();
          } catch {
            // ignore
          }
        }
      }


      function setRecordingUI(recording) {
        isRecording = recording;
        recordBtn.textContent = recording ? "停止录音" : "语音输入";
        recordBtn.classList.toggle("btn-primary", recording);
      }

      // 上传录音 Blob 到服务器进行 ASR 识别，返回识别结果文本，适用于录音结束后将音频数据发送到后端进行语音识别处理
      async function uploadAndRecognize(blob) {
        const formData = new FormData();
        formData.append("audio", blob, "record.ogg");

        const response = await fetch("/speech/asr", {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || "ASR 请求失败");
        }
        const data = await response.json();
        return data.text || "";
      }

      // 确保与 TTS WebSocket 的连接已建立并获取 sessionId，适用于在开始新的对话或提问前准备好 TTS 连接，以便后续的 AI 回复能够通过该连接进行语音合成和播放
      function ensureTtsConnection() {

        return new Promise((resolve) => {
          // 如果已经有可用的 TTS WebSocket 连接和 sessionId，直接 resolve，避免重复创建连接，提高效率
          if (ttsWs && ttsWs.readyState === WebSocket.OPEN && ttsSessionId) {
            resolve();
            return;
          }

          //选择协议，根据当前页面的协议（http 或 https）选择合适的 WebSocket 协议（ws 或 wss），确保在安全环境下使用加密的 WebSocket 连接，适用于在不同部署环境下自动适配正确的 WebSocket 协议以保证连接的安全性和兼容性
          const protocol = window.location.protocol === "https:" ? "wss" : "ws";

          const wsUrl = `${protocol}://${window.location.host}/speech/tts/ws`;
          const ws = new WebSocket(wsUrl);
          // 设置 WebSocket 的 binaryType 为 "arraybuffer"，以便接收二进制音频数据进行 TTS 播放，适用于后续通过该连接接收来自服务器的音频数据流并正确处理为 ArrayBuffer 格式以供播放器使用
          ws.binaryType = "arraybuffer";

          ttsWs = ws;

          ws.onopen = () => {
            // 等待 sessionId 消息
          };

          ws.onmessage = (event) => {
            if (typeof event.data === "string") {
              try {
                const msg = JSON.parse(event.data);
                if (msg.type === "session" && msg.sessionId) {
                  ttsSessionId = msg.sessionId;
                  resolve();
                } else if (msg.type === "tts_started") {
                  prepareStreamingAudio();

                } else if (msg.type === "tts_final" || msg.type === "tts_closed") {
                  ttsStreamFinal = true;
                  flushTtsBufferQueue();

                } else if (msg.type === "tts_error") {
                  ttsStreamFinal = true;
                  flushTtsBufferQueue();

                }
              } catch {
                // ignore
              }
            } else if (event.data instanceof ArrayBuffer) {
              ttsPendingBuffers.push(event.data);
              flushTtsBufferQueue();
            }
          };

          ws.onerror = () => {
            closeTtsWs();
            resolve();
          };

          ws.onclose = () => {
            ttsWs = null;
          };
        });
      }

      // 使用 EventSource 连接后端的 AI 流式接口，实时接收 AI 回复的文本内容并更新界面，适用于在用户提问后通过服务器发送事件流的方式获取 AI 的回答，并动态显示在聊天界面上
      function streamAiReply(query) {
        return new Promise((resolve) => {
          closeActiveStream();

          const aiMsg = appendMessage("assistant", "", "AI 正在回答...");
          activeAssistantContentEl = aiMsg.content;
          activeAssistantMetaEl = aiMsg.meta;

          const url =
            "/ai/chat/stream?query=" +
            encodeURIComponent(query) +
            (ttsSessionId ? "&ttsSessionId=" + encodeURIComponent(ttsSessionId) : "");
          const es = new EventSource(url);
          let aiResult = "";
          activeStream = es;

          es.onmessage = (event) => {
            aiResult += event.data || "";
            activeAssistantContentEl.textContent = aiResult || "（空结果）";
            scrollToBottom();
          };

          es.onerror = () => {
            es.close();
            if (activeStream === es) {
              activeStream = null;
            }
            if (activeAssistantMetaEl) {
              activeAssistantMetaEl.textContent = "AI 回复完成 " + nowTime();
            }
            resolve(aiResult);
          };
        });
      }

      // 处理用户提问的核心函数，负责验证输入、更新界面状态、调用 AI 流式接口获取回复，并处理 TTS 连接，适用于用户通过文本输入或语音输入提出问题后，进行一系列的准备工作和调用后端接口来获取 AI 的回答，并在界面上进行相应的更新和状态管理
      async function askWithQuery(query, source) {
        const trimmed = query.trim();
        if (!trimmed) {
          setStatus("请输入问题");
          return;
        }

        appendMessage("user", trimmed, source + " " + nowTime());

        promptInput.value = "";
        sendBtn.disabled = true;
        setStatus("AI 正在流式回答...", true);

        try {

          await ensureTtsConnection();

          await streamAiReply(trimmed);

          setStatus("对话完成");
        } catch (error) {
          appendMessage(
            "assistant",
            "处理失败：" + (error.message || String(error)),
            "异常 " + nowTime(),
          );
          setStatus("处理失败");
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener("click", async () => {
        await askWithQuery(promptInput.value, "文字提问");
      });

      promptInput.addEventListener("keydown", async (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          // 阻止默认的换行行为，适用于用户按下回车键时希望直接发送提问而不是在输入框中换行
          event.preventDefault();
          await askWithQuery(promptInput.value, "文字提问");
        }
      });

      //绑定按钮的点击事件，处理录音的开始和停止逻辑，以及录音数据的上传和识别，适用于用户通过点击语音输入按钮来控制录音的流程，
      //并在录音完成后将音频数据发送到后端进行 ASR 识别，然后获取 AI 的回复
      recordBtn.addEventListener("click", async () => {

        if (isRecording) {
          if (mediaRecorder) {
            mediaRecorder.stop();
            setStatus("已停止录音，正在识别...");
          }
          return;
        }

        try {
          closeActiveStream();

          // 语音通道与文字通道解耦，不关闭 TTS WS，方便连续对话复用 session
          activeRecordStream = await navigator.mediaDevices.getUserMedia({ audio: true });

          chunks = [];
          const preferredMimeType = "audio/ogg;codecs=opus";

          // 优先使用支持的编码格式创建 MediaRecorder，确保录音数据兼容后端 ASR 识别接口的要求，适用于在不同浏览器环境下选择最佳的录音格式以获得更好的兼容性和识别效果
          mediaRecorder = MediaRecorder.isTypeSupported(preferredMimeType)
            ? new MediaRecorder(activeRecordStream, { mimeType: preferredMimeType })
            : new MediaRecorder(activeRecordStream);

          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              chunks.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            try {
              // 将录音数据合并成一个 Blob 对象，并检查是否有有效的录音数据，适用于在用户完成录音后准备好音频数据进行上传和识别，如果录音数据为空则提示用户重新录制
              const blob = new Blob(chunks, {
                type: mediaRecorder.mimeType || "audio/webm",
              });

              if (!blob.size) {
                throw new Error("录音数据为空，请至少录制 1 秒再上传");
              }

              // 录音结束后上传并识别，然后调用 AI 流式接口获取回复
              setStatus("语音识别中...");

              //****此时已经获取到由腾讯云返回的ASR识别结果文本****
              const recognized = (await uploadAndRecognize(blob)).trim();
              promptInput.value = recognized;

              if (!recognized) {
                setStatus("识别为空，请重新录音");
                return;
              }

              // 识别成功后直接调用提问函数，获取 AI 回复并处理 TTS 播放
              await askWithQuery(recognized, "语音提问");

            } catch (error) {

              appendMessage(
                "assistant",
                "语音处理失败：" + (error.message || String(error)),
                "异常 " + nowTime(),
              );
              setStatus("语音处理失败");
            } finally {
              if (activeRecordStream) {
                activeRecordStream.getTracks().forEach((t) => t.stop());
                activeRecordStream = null;
              }
              setRecordingUI(false);
            }
          };

          mediaRecorder.start(250);
          setRecordingUI(true);
          setStatus("录音中，点击“停止录音”完成提问");
        } catch (error) {
          appendMessage(
            "assistant",
            "无法开始录音：" + (error.message || String(error)),
            "异常 " + nowTime(),
          );
          setStatus("无法开始录音");
          setRecordingUI(false);
        }
      });
    </script>
  </body>
</html>
